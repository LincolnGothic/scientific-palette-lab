[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-palette-lab"
version = "0.1.0"
description = "Reviewed chart and flowchart palette mining for Nature, Science and Cell"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.scripts]
palette-lab = "palette_lab.__main__:main"

[tool.setuptools.package-data]
palette_lab = ["web/*"]
